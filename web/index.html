<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat with Sara</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #19322d;
      background: #eaf1ea;
      --muted: #536861;
      --line: #dbe5dc;
      --accent: #17644e;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    button, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    :focus-visible { outline: 2px solid #2b8069; outline-offset: 3px; }
    [hidden] { display: none !important; }

    .chat {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      height: min(850px, calc(100dvh - 48px));
      max-width: 760px;
      margin: 24px auto;
      background: #f9fbf8;
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 14px 50px #25462c12;
      overflow: hidden;
    }

    .topbar, .topbar-actions, .profile, .compose-row { display: flex; align-items: center; }
    .topbar {
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .avatar {
      display: grid;
      place-items: center;
      flex: 0 0 44px;
      height: 44px;
      border-radius: 15px;
      background: var(--accent);
      color: white;
      font: 700 1.4rem Georgia, serif;
    }
    h1 { margin: 0; font-size: 1.2rem; letter-spacing: -.025em; }
    .status, .profile { color: var(--muted); font-size: .85rem; }
    .topbar-actions { gap: 8px; margin-left: auto; }
    .profile { gap: 8px; }
    select {
      padding: 7px 9px;
      color: inherit;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .conversation {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 24px;
      overscroll-behavior-y: contain;
    }
    .chat-body { display: flex; min-height: 0; }
    .memory-panel {
      flex: 0 0 220px;
      padding: 16px;
      overflow-y: auto;
      overflow-wrap: anywhere;
      border-left: 1px solid var(--line);
      background: white;
      font-size: .9rem;
    }
    .memory-panel h2 { margin: 0; font-size: 1rem; }
    .memory-panel ul { display: grid; gap: 8px; padding-left: 18px; }
    .memory-panel p { color: var(--muted); }
    .messages { display: flex; flex-direction: column; gap: 12px; }
    .empty { margin: 48px 0; color: var(--muted); text-align: center; }
    .bubble {
      align-self: flex-start;
      max-width: min(85%, 540px);
      margin: 0;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 16px 16px 16px 4px;
      background: white;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .bubble.user {
      align-self: flex-end;
      border-color: transparent;
      border-radius: 16px 16px 4px 16px;
      background: #dff0e5;
    }
    .bubble.typing { color: var(--muted); }
    .bubble.voice { border-color: #cbded6; background: #f2f8f5; }
    .bubble.user.voice { background: #e2f0e9; }
    .voice-label {
      display: block;
      margin-bottom: 3px;
      color: #41645a;
      font-size: .75rem;
      font-weight: 650;
    }

    form {
      padding: 14px 24px 18px;
      border-top: 1px solid var(--line);
      background: white;
    }
    .compose-row { align-items: flex-end; gap: 9px; }
    textarea {
      flex: 1;
      min-width: 0;
      min-height: 46px;
      max-height: 9rem;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: inherit;
      background: #f9fbf8;
      line-height: 1.45;
      resize: vertical;
    }
    button {
      padding: 11px 16px;
      min-height: 46px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: var(--accent);
      font-weight: 650;
    }
    button:enabled:hover { background: #0f523e; }
    button:disabled { cursor: default; opacity: .55; }
    .toolbar-button {
      min-height: 36px;
      padding: 6px 9px;
      background: white;
      border: 1px solid var(--line);
      color: var(--accent);
      font-size: .85rem;
      white-space: nowrap;
    }
    .toolbar-button:enabled:hover, .toolbar-button[aria-expanded="true"] { background: #eaf1ea; }
    .call-button { min-height: 36px; padding: 6px 10px; font-size: .85rem; white-space: nowrap; }
    .call-panel {
      --call-signal: #a4c1b8;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      margin: 16px 24px 0;
      padding: 18px;
      border-radius: 16px;
      background: #173b33;
      color: #fff;
    }
    .call-panel[data-connected="true"] { --call-signal: #a1e5c5; }
    .call-panel :focus-visible { outline-color: #d9f5e9; }
    .call-panel h2 { margin: 0; font-size: 1rem; }
    .call-status {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 4px 0 0;
      color: var(--call-signal);
      font-size: .85rem;
    }
    .call-status::before { content: ''; flex: 0 0 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .end-call { min-height: 44px; padding: 8px 14px; background: #ab3d38; font-size: .875rem; white-space: nowrap; }
    .end-call:enabled:hover { background: #93332e; }
    .call-feedback { margin: 12px 24px 0; color: #9f392d; font-size: .88rem; }
    .notice { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .notice span { color: #9f392d; font-size: .88rem; }
    .notice button { padding: 4px 8px; min-height: auto; font-size: .85rem; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 820px) {
      .chat { margin-inline: 16px; }
    }
    @media (max-width: 560px) {
      .chat { height: 100dvh; margin: 0; border: 0; border-radius: 0; }
      .topbar, .conversation, form { padding-inline: 14px; }
      .topbar { gap: 8px; flex-wrap: wrap; }
      .profile-label { display: none; }
      .call-panel { margin: 12px 14px 0; padding: 14px; }
      .call-feedback { margin-inline: 14px; }
      form { padding-bottom: max(14px, env(safe-area-inset-bottom)); }
      .chat-body { flex-direction: column-reverse; }
      .memory-panel { flex: 0 0 auto; max-height: 28dvh; border: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <main class="chat" aria-labelledby="title">
    <header class="topbar">
      <span class="avatar" aria-hidden="true">S</span>
      <div>
        <h1 id="title">Sara</h1>
        <div class="status" id="connection" role="status">Connecting…</div>
      </div>
      <div class="topbar-actions">
        <label class="profile" for="profile">
          <span class="profile-label">Demo user</span>
          <select id="profile" aria-label="Demo user">
            <option value="demo-1">User 1</option>
            <option value="demo-2">User 2</option>
          </select>
        </label>
        <button class="toolbar-button" id="new-chat" type="button" disabled>New chat</button>
        <button class="toolbar-button" id="memory-toggle" type="button" aria-controls="memory-panel" aria-expanded="false">Memory</button>
        <button class="call-button" id="call" type="button" disabled>Call Sara</button>
      </div>
    </header>

    <div>
      <section class="call-panel" id="call-panel" aria-labelledby="call-title" hidden>
        <div>
          <h2 id="call-title">Voice call with Sara</h2>
          <p class="call-status" id="call-status" role="status" aria-atomic="true"></p>
        </div>
        <button class="end-call" id="end-call" type="button">End call</button>
      </section>
      <p class="call-feedback" id="call-feedback" role="status" hidden></p>
    </div>

    <div class="chat-body">
      <div class="conversation" id="conversation">
        <p class="empty" id="empty" hidden>No messages yet.</p>
        <div id="messages" class="messages" role="log" aria-label="Conversation" aria-relevant="additions"></div>
      </div>
      <aside class="memory-panel" id="memory-panel" aria-labelledby="memory-title" hidden>
        <h2 id="memory-title">Saved facts</h2>
        <p id="memory-status" role="status"></p>
        <ul id="memory-list" hidden></ul>
      </aside>
    </div>

    <form id="composer">
      <div class="notice" id="notice" hidden>
        <span id="notice-text" role="status"></span>
        <button id="retry" type="button" hidden>Retry</button>
      </div>
      <div class="compose-row">
        <label class="sr-only" for="message">Message Sara</label>
        <textarea id="message" rows="1" maxlength="4000" placeholder="Message Sara"></textarea>
        <button id="send" type="submit" disabled>Send</button>
      </div>
    </form>
  </main>

  <audio id="call-audio" autoplay></audio>
  <script src="/livekit-client.js"></script>
  <script>
    const profile = document.querySelector('#profile');
    const connection = document.querySelector('#connection');
    const conversation = document.querySelector('#conversation');
    const messages = document.querySelector('#messages');
    const empty = document.querySelector('#empty');
    const composer = document.querySelector('#composer');
    const messageInput = document.querySelector('#message');
    const send = document.querySelector('#send');
    const notice = document.querySelector('#notice');
    const noticeText = document.querySelector('#notice-text');
    const retry = document.querySelector('#retry');
    const newChat = document.querySelector('#new-chat');
    const memoryToggle = document.querySelector('#memory-toggle');
    const memoryPanel = document.querySelector('#memory-panel');
    const memoryStatus = document.querySelector('#memory-status');
    const memoryList = document.querySelector('#memory-list');
    const callButton = document.querySelector('#call');
    const callPanel = document.querySelector('#call-panel');
    const callStatus = document.querySelector('#call-status');
    const callFeedback = document.querySelector('#call-feedback');
    const endCallButton = document.querySelector('#end-call');
    const callAudio = document.querySelector('#call-audio');
    let current;
    let activeCall;

    function showNotice(text = '', canRetry = false) {
      noticeText.textContent = text;
      notice.hidden = !text;
      retry.hidden = !canRetry;
    }

    function updateComposer() {
      const busy = !current.ready || current.sending || current.clearing;
      send.disabled = busy || !messageInput.value.trim();
      newChat.disabled = busy || !!activeCall;
      callButton.disabled = !current.ready || current.clearing;
      callButton.hidden = !!activeCall;
    }

    function showCallFeedback(text = '') {
      callFeedback.textContent = text;
      callFeedback.hidden = !text;
    }

    function renderCall(call) {
      if (activeCall !== call) return;
      const { localParticipant, activeSpeakers } = call.room;
      const connected = Boolean(call.micReady && call.track && !call.reconnecting);
      let status = 'Connecting…';
      if (call.reconnecting) {
        status = 'Reconnecting…';
      } else if (connected) {
        if (activeSpeakers.includes(localParticipant)) {
          status = 'You’re speaking';
        } else if (activeSpeakers.some(({ identity }) => identity === call.agentIdentity)) {
          status = 'Sara is speaking';
        } else {
          status = 'Listening';
        }
      } else if (call.micReady) {
        status = 'Waiting for Sara…';
      }
      callPanel.dataset.connected = String(connected);
      if (callStatus.textContent !== status) callStatus.textContent = status;
    }

    function endCall(status = '') {
      const call = activeCall;
      const restoreFocus = callPanel.contains(document.activeElement);
      const follow = isNearLatest();
      activeCall = undefined;
      if (call) {
        call.request.abort();
        clearTimeout(call.timer);
        call.track?.detach(callAudio);
        void call.room.disconnect().catch(console.warn);
      }
      callPanel.hidden = true;
      showCallFeedback(status);
      updateComposer();
      if (follow) scrollToLatest();
      if (restoreFocus) callButton.focus();
    }

    async function startCall() {
      if (activeCall) return;
      const sdk = globalThis.LivekitClient;
      if (!sdk) {
        showCallFeedback('Couldn’t load the voice call.');
        return;
      }
      const { Room, RoomEvent, Track } = sdk;
      const room = new Room();
      const request = new AbortController();
      const follow = isNearLatest();
      const call = activeCall = {
        room, request,
        timer: setTimeout(() => {
          if (activeCall === call) endCall('Sara couldn’t join the call. Try again.');
        }, 30_000),
      };
      showCallFeedback();
      callPanel.hidden = false;
      renderCall(call);
      updateComposer();
      if (follow) scrollToLatest();
      endCallButton.focus();

      function updateCall() {
        if (call.track && call.micReady) clearTimeout(call.timer);
        renderCall(call);
      }
      room.on(RoomEvent.TrackSubscribed, (track, _publication, participant) => {
        if (activeCall !== call || track.kind !== Track.Kind.Audio) return;
        call.track = track;
        call.agentIdentity = participant.identity;
        track.attach(callAudio);
        updateCall();
      });
      room.on(RoomEvent.TrackUnsubscribed, (track) => {
        if (call.track === track) {
          track.detach(callAudio);
          call.track = undefined;
          updateCall();
        }
      });
      room.on(RoomEvent.Disconnected, () => {
        if (activeCall === call) endCall('Call disconnected.');
      });
      room.on(RoomEvent.ParticipantDisconnected, (participant) => {
        if (activeCall === call && participant.identity === call.agentIdentity) endCall('Sara left the call.');
      });
      room.on(RoomEvent.Reconnecting, () => {
        call.reconnecting = true;
        updateCall();
      });
      room.on(RoomEvent.Reconnected, () => {
        call.reconnecting = false;
        updateCall();
      });
      room.on(RoomEvent.ActiveSpeakersChanged, () => renderCall(call));
      // Unlock audio while handling the click.
      void room.startAudio().catch(() => {});
      try {
        const response = await fetch(`${current.base}/call`, { method: 'POST', signal: request.signal });
        const { url, token, error } = await response.json();
        if (!response.ok) throw new Error(error || 'Couldn’t start a call.');
        if (activeCall !== call) return;
        await room.connect(url, token);
        if (activeCall !== call) return;
        const publication = await room.localParticipant.setMicrophoneEnabled(true);
        if (!publication) throw new Error('Couldn’t turn on the microphone. Try again.');
        call.micReady = true;
        updateCall();
      } catch (error) {
        if (activeCall === call) endCall(error.name === 'NotAllowedError'
          ? 'Allow microphone access to call Sara.'
          : error.message || 'Couldn’t start a call.');
      }
    }

    function scrollToLatest() {
      conversation.scrollTop = conversation.scrollHeight;
    }

    function isNearLatest() {
      return conversation.scrollHeight - conversation.scrollTop - conversation.clientHeight < 80;
    }

    function voiceLabel(role) {
      const label = document.createElement('small');
      label.className = 'voice-label';
      label.textContent = `${role === 'user' ? 'You' : 'Sara'} · Voice`;
      return label;
    }

    function appendMessage(session, message) {
      if (session.messageIds.has(message.id)) return;
      session.messageIds.add(message.id);
      const bubble = document.createElement('p');
      bubble.classList.add('bubble', message.role);
      if (message.channel === 'voice') {
        bubble.classList.add('voice');
        bubble.append(voiceLabel(message.role), message.content);
      } else {
        const speaker = document.createElement('span');
        speaker.className = 'sr-only';
        speaker.textContent = message.role === 'user' ? 'You: ' : 'Sara: ';
        bubble.append(speaker, message.content);
      }
      messages.append(bubble);
      empty.hidden = true;
    }

    function applyEvent(session, type, data) {
      const follow = isNearLatest();
      const draft = session.drafts.get(data.generationId);
      if (type === 'typing') {
        if (data.userMessage) appendMessage(session, data.userMessage);
        if (!draft) {
          const bubble = document.createElement('p');
          bubble.className = 'bubble typing';
          bubble.setAttribute('aria-hidden', 'true');
          bubble.dataset.channel = data.userMessage?.channel ?? 'text';
          const voice = bubble.dataset.channel === 'voice';
          if (voice) {
            bubble.classList.add('voice');
            bubble.append(voiceLabel('assistant'));
          }
          bubble.append(voice ? 'Replying…' : 'Sara is typing…');
          session.drafts.set(data.generationId, bubble);
          messages.append(bubble);
          empty.hidden = true;
        }
      } else if (type === 'delta') {
        if (draft?.classList.contains('typing')) {
          draft.classList.remove('typing');
          draft.lastChild.remove();
        }
        draft?.append(data.delta);
      } else {
        draft?.remove();
        session.drafts.delete(data.generationId);
        if (type === 'done') {
          appendMessage(session, data.assistantMessage);
        } else if (data.reason || draft?.dataset.channel !== 'voice') {
          showNotice(data.reason || 'Reply cancelled.');
        }
        void refreshMemories(session);
      }
      if (follow) scrollToLatest();
    }

    async function refreshMemories(session) {
      if (memoryPanel.hidden) return;
      session.memoryRequest?.abort();
      const request = new AbortController();
      session.memoryRequest = request;
      try {
        const response = await fetch(`${session.base}/memories`, { signal: request.signal });
        if (!response.ok) throw new Error('Memory request failed');
        const { memories } = await response.json();
        if (session !== current || request.signal.aborted) return;
        const items = memories.map(({ fact }) => {
          const item = document.createElement('li');
          item.textContent = fact;
          return item;
        });
        memoryList.replaceChildren(...items);
        memoryList.hidden = !items.length;
        memoryStatus.textContent = items.length ? '' : 'No saved facts yet.';
        memoryStatus.hidden = items.length > 0;
      } catch {
        if (session !== current || request.signal.aborted) return;
        memoryList.replaceChildren();
        memoryList.hidden = true;
        memoryStatus.textContent = 'Couldn’t load saved facts.';
        memoryStatus.hidden = false;
      }
    }

    async function loadHistory(session) {
      session.historyRequest?.abort();
      const request = new AbortController();
      session.historyRequest = request;
      messages.setAttribute('aria-busy', 'true');
      showNotice();
      try {
        const response = await fetch(`${session.base}/history`, { signal: request.signal });
        if (!response.ok) throw new Error('History request failed');
        const history = await response.json();
        if (session !== current || request.signal.aborted) return;

        messages.replaceChildren();
        session.messageIds.clear();
        session.drafts.clear();
        empty.hidden = history.messages.length > 0;
        for (const message of history.messages) appendMessage(session, message);
        for (const [type, data] of session.buffer) applyEvent(session, type, data);
        session.buffer = [];
        session.ready = true;
        connection.textContent = 'Connected';
        scrollToLatest();
      } catch {
        if (session !== current || request.signal.aborted) return;
        connection.textContent = 'History unavailable';
        showNotice('Couldn’t load the conversation.', true);
      } finally {
        if (session === current && !request.signal.aborted) {
          messages.removeAttribute('aria-busy');
          updateComposer();
        }
      }
    }

    function openConversation(uid) {
      const base = `/api/users/${encodeURIComponent(uid)}`;
      const pending = current?.base === base ? current.pending : undefined;
      current?.source.close();
      current?.historyRequest?.abort();
      current?.memoryRequest?.abort();
      const source = new EventSource(`${base}/events`);
      const session = current = {
        base, source, messageIds: new Set(), drafts: new Map(), buffer: [],
        ready: false, sending: false, clearing: false, pending,
      };
      messages.replaceChildren();
      memoryList.replaceChildren();
      memoryList.hidden = true;
      memoryStatus.hidden = false;
      memoryStatus.textContent = 'Loading saved facts…';
      empty.hidden = true;
      connection.textContent = 'Connecting…';
      showNotice();
      updateComposer();

      source.addEventListener('memories', () => {
        if (session === current) void refreshMemories(session);
      });
      source.addEventListener('history-cleared', () => resetConversation(session));
      for (const type of ['typing', 'delta', 'done', 'cancelled']) {
        source.addEventListener(type, (event) => {
          if (session !== current) return;
          const data = JSON.parse(event.data);
          if (session.ready) applyEvent(session, type, data);
          else session.buffer.push([type, data]);
        });
      }
      source.onopen = () => {
        if (session === current) {
          void loadHistory(session);
          void refreshMemories(session);
        }
      };
      source.onerror = () => {
        if (session !== current) return;
        session.historyRequest?.abort();
        session.ready = false;
        session.buffer = [];
        for (const draft of session.drafts.values()) draft.remove();
        session.drafts.clear();
        messages.removeAttribute('aria-busy');
        if (source.readyState === EventSource.CLOSED) {
          connection.textContent = 'Disconnected';
          showNotice('Couldn’t connect to the chat.', true);
        } else {
          connection.textContent = 'Reconnecting…';
        }
        updateComposer();
      };
    }

    function resetConversation(session) {
      if (session !== current) return;
      session.pending = undefined;
      messageInput.value = '';
      openConversation(profile.value);
    }

    async function startNewChat() {
      if (newChat.disabled) return;
      const session = current;
      session.clearing = true;
      showNotice();
      updateComposer();
      try {
        const response = await fetch(`${session.base}/history`, { method: 'DELETE' });
        if (!response.ok) throw new Error('History reset failed');
        resetConversation(session);
      } catch {
        if (session === current) showNotice('Couldn’t start a new chat. Try again.');
      } finally {
        session.clearing = false;
        if (session === current) updateComposer();
      }
    }

    async function submitMessage(event) {
      event.preventDefault();
      const session = current;
      const input = messageInput.value;
      const content = input.trim();
      if (!session.ready || session.sending || session.clearing || !content) return;

      if (session.pending?.content !== content) {
        session.pending = { content, clientMessageId: crypto.randomUUID() };
      }
      session.sending = true;
      showNotice();
      updateComposer();
      try {
        const response = await fetch(`${session.base}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(session.pending),
        });
        const result = await response.json();
        if (!response.ok) {
          if (response.status === 409) session.pending = undefined;
          throw new Error(result.error || 'Couldn’t send the message.');
        }
        if (session !== current) return;
        appendMessage(session, result.message);
        if (messageInput.value === input) messageInput.value = '';
        session.pending = undefined;
        scrollToLatest();
      } catch (error) {
        if (session === current) showNotice(error.message || 'Couldn’t send the message.');
      } finally {
        session.sending = false;
        if (session === current) updateComposer();
      }
    }

    profile.addEventListener('change', () => {
      endCall();
      const url = new URL(location.href);
      url.searchParams.set('user', profile.value);
      history.replaceState(null, '', url);
      messageInput.value = '';
      openConversation(profile.value);
    });
    retry.addEventListener('click', () => {
      if (current.source.readyState === EventSource.OPEN) void loadHistory(current);
      else openConversation(profile.value);
    });
    newChat.addEventListener('click', startNewChat);
    callButton.addEventListener('click', startCall);
    endCallButton.addEventListener('click', () => endCall());
    window.addEventListener('pagehide', () => {
      if (activeCall) endCall();
    });
    memoryToggle.addEventListener('click', () => {
      memoryPanel.hidden = !memoryPanel.hidden;
      memoryToggle.setAttribute('aria-expanded', String(!memoryPanel.hidden));
      if (memoryPanel.hidden) current.memoryRequest?.abort();
      else void refreshMemories(current);
    });
    messageInput.addEventListener('input', updateComposer);
    messageInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        if (!send.disabled) composer.requestSubmit();
      }
    });
    composer.addEventListener('submit', submitMessage);

    const selected = new URLSearchParams(location.search).get('user');
    if (Array.from(profile.options).some((option) => option.value === selected)) {
      profile.value = selected;
    }
    openConversation(profile.value);
  </script>
</body>
</html>
